<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MedBook – Appointments</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>MedBook – Doctor Appointments</h1>
      <p class="tagline">
        Simple interface to create, view, update and delete appointments.
      </p>
    </header>

    <main>
      <section class="card">
        <h2>Create / Edit Appointment</h2>
        <form id="appointment-form">
          <input type="hidden" id="appointment-id" />

          <label for="patientName">Patient Name</label>
          <input type="text" id="patientName" required />

          <label for="doctorName">Doctor Name</label>
          <input type="text" id="doctorName" required />

          <label for="date">Date</label>
          <input type="date" id="date" required />

          <div class="form-actions">
            <button type="submit" class="btn primary">Save</button>
            <button type="button" id="cancel-edit" class="btn secondary hidden">
              Cancel Edit
            </button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Appointments List</h2>
        <table class="table" id="appointments-table">
          <thead>
            <tr>
              <th>Patient</th>
              <th>Doctor</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
        <p id="empty-message" class="muted">No appointments yet.</p>
      </section>
    </main>

    <footer class="footer">
      <p>MedBook • Assignment 3 – Part 2 • MongoDB + Express</p>
      <p>Lalaland</p>
    </footer>
  </div>

  <script src="/main.js"></script>
</body>
</html>
